name: Cursor - Daily Issue Triage

on:
  schedule:
    - cron: "40 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  discussions: write
  issues: write

concurrency:
  group: cursor-daily-triage
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Require Cursor API key
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${CURSOR_API_KEY:-}" ]]; then
            echo "CURSOR_API_KEY secret is required." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Find oldest untriaged issues
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .cursor-input .cursor-output

          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "sort:created-asc -label:triaged -label:agentic-workflows" \
            --limit 10 \
            --json number,title,body,author,labels,comments,createdAt,url \
            > .cursor-input/daily-triage-issues.json

          jq --arg repository "$GITHUB_REPOSITORY" \
            '{repository: $repository, issues: .}' \
            .cursor-input/daily-triage-issues.json \
            > .cursor-input/daily-triage.json

          issue_count="$(jq '.issues | length' .cursor-input/daily-triage.json)"
          if [[ "$issue_count" -eq 0 ]]; then
            echo "No untriaged issues found."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found ${issue_count} untriaged issue(s)."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify issues with Cursor
        if: ${{ steps.context.outputs.found == 'true' }}
        uses: ./.github/actions/run-cursor
        with:
          prompt-file: .github/cursor/prompts/daily-triage.md
          mode: analysis
          output-file: .cursor-output/daily-triage.json
          model: ${{ vars.CURSOR_AGENT_MODEL }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      - name: Validate Cursor output
        if: ${{ steps.context.outputs.found == 'true' }}
        run: |
          set -euo pipefail
          jq -e --slurpfile context .cursor-input/daily-triage.json '
            def in_list($values):
              . as $value | $values | index($value) != null;

            (type == "object") and
            ((keys | sort) == ["issues"]) and
            (.issues | type == "array" and length >= 1 and length <= 10) and
            (([.issues[].number] | unique | length) == (.issues | length)) and
            (([.issues[].number] | sort) ==
              ($context[0].issues | map(.number) | sort)) and
            all(.issues[];
              (type == "object") and
              ((keys | sort) == [
                "areas", "category", "comment", "number", "priority"
              ]) and
              (.number | type == "number" and . == floor and . > 0) and
              (.category | in_list([
                "bug", "feature", "question", "documentation",
                "performance", "accessibility", "maintenance"
              ])) and
              (.areas as $areas |
                ($areas | type == "array") and
                ($areas | length >= 1 and length <= 6) and
                (($areas | unique | length) == ($areas | length)) and
                all($areas[]; in_list([
                  "area:timeline", "area:sqlite", "area:ui",
                  "area:auth", "area:api", "area:build"
                ]))) and
              (.priority | in_list([
                "priority:critical", "priority:high",
                "priority:medium", "priority:low"
              ])) and
              (.comment |
                type == "string" and
                length >= 1 and length <= 4000 and
                test("[ぁ-んァ-ヶ一-龠]")))
          ' .cursor-output/daily-triage.json >/dev/null

      - name: Apply labels and comments
        if: ${{ steps.context.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          repository_labels="$(
            gh label list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json name
          )"
          if ! jq -e 'any(.[]; .name == "triaged")' \
            <<<"$repository_labels" >/dev/null; then
            echo "Required repository label 'triaged' does not exist." >&2
            exit 1
          fi

          while IFS= read -r item; do
            issue_number="$(jq -r '.number' <<<"$item")"
            current_issue="$(
              gh issue view "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json state,labels
            )"

            if [[ "$(jq -r '.state' <<<"$current_issue")" != "OPEN" ]]; then
              echo "Issue #${issue_number} is no longer open; skipping."
              continue
            fi
            if jq -e '
              .labels |
              any(.[]; .name == "triaged" or .name == "agentic-workflows")
            ' <<<"$current_issue" >/dev/null; then
              echo "Issue #${issue_number} is already handled or excluded; skipping."
              continue
            fi

            desired_labels="$(
              jq -c '[.category, .areas[], .priority, "triaged"]' <<<"$item"
            )"
            label_plan="$(
              jq -cn \
                --argjson desired "$desired_labels" \
                --argjson available "$repository_labels" '
                  ($available | map(.name)) as $available_names |
                  {
                    available: [
                      $desired[] |
                      . as $label |
                      select($available_names | index($label) != null)
                    ],
                    missing: [
                      $desired[] |
                      . as $label |
                      select(($available_names | index($label)) == null)
                    ]
                  }
                '
            )"
            jq -r '
              .missing[] |
              "::warning::Repository label does not exist; omitting \(.)"
            ' <<<"$label_plan"
            labels="$(jq -r '.available | join(",")' <<<"$label_plan")"
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "$labels"

            comment_file="${RUNNER_TEMP}/cursor-daily-triage-${issue_number}.md"
            jq -r '.comment' <<<"$item" > "$comment_file"
            gh issue comment "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file "$comment_file"
          done < <(jq -c '.issues[]' .cursor-output/daily-triage.json)

      - name: Create summary discussion
        if: ${{ steps.context.outputs.found == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          metadata="$RUNNER_TEMP/cursor-daily-triage-discussions.json"
          summary="$RUNNER_TEMP/cursor-daily-triage-summary.md"

          gh api graphql \
            -F owner="$owner" \
            -F name="$repository" \
            -f query='query($owner: String!, $name: String!) {
              repository(owner: $owner, name: $name) {
                id
                discussionCategories(first: 100) { nodes { id name } }
                discussions(first: 100, orderBy: {field: UPDATED_AT, direction: DESC}) {
                  nodes { id title closed }
                }
              }
            }' > "$metadata"

          repository_id="$(jq -r '.data.repository.id // empty' "$metadata")"
          category_id="$(jq -r '
            .data.repository.discussionCategories.nodes[]
            | select(.name == "General")
            | .id
          ' "$metadata" | head -n 1)"
          if [[ -z "$repository_id" || -z "$category_id" ]]; then
            echo "::warning::General discussion category is unavailable; skipping summary"
            exit 0
          fi

          issue_count="$(jq '.issues | length' .cursor-output/daily-triage.json)"
          {
            printf '# Daily triage summary\n\n'
            printf -- '- 処理したIssue: %s件\n\n' "$issue_count"
            printf '## 分類\n\n'
            jq -r '
              [.issues | group_by(.category)[] | "- \(.[0].category): \(length)件"]
              | .[]
            ' .cursor-output/daily-triage.json
            printf '\n## 優先度\n\n'
            jq -r '
              [.issues | group_by(.priority)[] | "- \(.[0].priority): \(length)件"]
              | .[]
            ' .cursor-output/daily-triage.json
            printf '\n## 対象Issue\n\n'
            jq -r '.issues[] | "- #\(.number): `\(.category)` / `\(.priority)`"' \
              .cursor-output/daily-triage.json
          } > "$summary"

          title="[daily-triage] $(date -u +%F)"
          created="$RUNNER_TEMP/cursor-daily-triage-created.json"
          gh api graphql \
            -F repositoryId="$repository_id" \
            -F categoryId="$category_id" \
            -f title="$title" \
            -F body="@$summary" \
            -f query='mutation(
              $repositoryId: ID!,
              $categoryId: ID!,
              $title: String!,
              $body: String!
            ) {
              createDiscussion(input: {
                repositoryId: $repositoryId,
                categoryId: $categoryId,
                title: $title,
                body: $body
              }) { discussion { id url } }
            }' > "$created"
          jq -r '.data.createDiscussion.discussion.url' "$created" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .data.repository.discussions.nodes[]
            | select((.title | startswith("[daily-triage] ")) and (.closed | not))
            | .id
          ' "$metadata" | while IFS= read -r discussion_id; do
            gh api graphql \
              -F discussionId="$discussion_id" \
              -f query='mutation($discussionId: ID!) {
                closeDiscussion(input: {discussionId: $discussionId}) {
                  discussion { id closed }
                }
              }' >/dev/null
          done
