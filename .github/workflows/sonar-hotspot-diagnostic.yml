name: Sonar Hotspot Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - run: corepack enable yarn
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn --immutable
      - name: Run tests with coverage
        run: yarn test:coverage
      - name: Generate and retain the SonarQube scanner report
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        with:
          args: -Dsonar.scanner.keepReport=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Show issue records from the scanner report
        run: |
          report_dir=".scannerwork/scanner-report"
          if [[ ! -d "${report_dir}" ]]; then
            echo "::error::The retained SonarQube scanner report was not found."
            exit 1
          fi

          issue_count=0
          while IFS= read -r -d '' issue_file; do
            issue_count=$((issue_count + 1))
            component_id="${issue_file##*/issues-}"
            component_id="${component_id%.pb}"
            component_file="${report_dir}/component-${component_id}.pb"

            echo "::group::SonarQube issue component ${component_id}"
            if [[ -f "${component_file}" ]]; then
              strings "${component_file}"
            fi
            strings "${issue_file}"
            echo "::endgroup::"
          done < <(
            find "${report_dir}" \
              -type f \
              -name 'issues-*.pb' \
              -size +0c \
              -print0 \
              | sort -z
          )

          echo "Non-empty issue report files: ${issue_count}"
