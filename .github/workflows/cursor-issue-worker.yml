name: Cursor Issue Worker

on:
  workflow_call:
    inputs:
      issue_number:
        description: Open issue number to implement
        required: true
        type: string
      additional_context:
        description: Optional trusted context supplied by the caller
        required: false
        type: string
        default: ""
    secrets:
      CURSOR_API_KEY:
        description: Cursor API key
        required: true
      GH_AW_GITHUB_TOKEN:
        description: Optional GitHub token retained from gh-aw for event-producing mutations
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cursor-issue-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    name: Implement issue with Cursor
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ISSUE_NUMBER: ${{ inputs.issue_number }}

    steps:
      - name: Validate Cursor secret
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          set -euo pipefail

          if [[ -z "$CURSOR_API_KEY" ]]; then
            echo "::error::Repository secret CURSOR_API_KEY is not configured"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate issue and prepare Cursor context
        env:
          ADDITIONAL_CONTEXT: ${{ inputs.additional_context }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::issue_number must be a positive integer"
            exit 1
          fi

          mkdir -p .cursor-input .cursor-output
          issue_api="$RUNNER_TEMP/cursor-issue-${ISSUE_NUMBER}.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_api"

          if jq -e 'has("pull_request") or .state != "open"' "$issue_api" >/dev/null; then
            echo "::error::Cursor issue worker only accepts open issues"
            exit 1
          fi

          if jq -e '
            [.labels[].name]
            | any(
                . == "agent:in-progress" or
                . == "agent:claimed" or
                . == "agent:review" or
                . == "agent:done"
              )
          ' "$issue_api" >/dev/null; then
            echo "::error::Issue is already being handled or has completed agent work"
            exit 1
          fi

          gh issue view "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json number,title,body,state,url,author,labels,comments \
            > .cursor-input/issue.json
          printf '%s\n' "$ADDITIONAL_CONTEXT" > .cursor-input/additional-context.txt

      - name: Create isolated working branch
        id: branch
        run: |
          set -euo pipefail

          branch_name="cursor/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git switch -c "$branch_name"
          echo "name=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Claim issue
        id: claim
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          issue_api="$RUNNER_TEMP/cursor-claim-${ISSUE_NUMBER}.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$issue_api"
          remove_labels="$(jq -r '
            [.labels[].name]
            | map(select(
                . == "agent:blocked" or
                . == "symphony/failed" or
                . == "agent:review"
              ))
            | join(",")
          ' "$issue_api")"
          if [[ -n "$remove_labels" ]]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$remove_labels"
          fi
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label agent:in-progress

      - name: Post claim comment
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "🤖 Cursor Agent がこの Issue の実装を開始しました。"

      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Implement with Cursor
        uses: ./.github/actions/run-cursor
        with:
          prompt-file: .github/cursor/prompts/issue-worker.md
          mode: coding
          output-file: .cursor-output/issue-worker.txt
          model: ${{ vars.CURSOR_AGENT_MODEL }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      - name: Validate Cursor changes
        run: |
          set -euo pipefail

          automation_changes="$(git status --porcelain --untracked-files=all -- \
            .github \
            .cursor \
            .codex \
            AGENTS.md \
            ':(glob)**/AGENTS.md' \
            CLAUDE.md \
            ':(glob)**/CLAUDE.md' \
            src/zenstack)"
          if [[ -n "$automation_changes" ]]; then
            echo "::error::Cursor modified protected automation files"
            printf '%s\n' "$automation_changes"
            exit 1
          fi

          rm -rf -- .cursor-input .cursor-output
          if [[ -z "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "::error::Cursor did not produce an implementation change"
            exit 1
          fi

      - name: Run formatter and linter check
        run: yarn check

      - name: Run TypeScript check
        run: yarn exec tsc --noEmit

      - name: Run production build
        run: yarn build

      - name: Recheck protected files after verification
        run: |
          set -euo pipefail

          protected_changes="$(git status --porcelain --untracked-files=all -- \
            .github \
            .cursor \
            .codex \
            AGENTS.md \
            ':(glob)**/AGENTS.md' \
            CLAUDE.md \
            ':(glob)**/CLAUDE.md' \
            src/zenstack)"
          if [[ -n "$protected_changes" ]]; then
            echo "::error::Verification modified protected files"
            printf '%s\n' "$protected_changes"
            exit 1
          fi

      - name: Publish pull request and update issue
        env:
          BRANCH_NAME: ${{ steps.branch.outputs.name }}
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          issue_api="$RUNNER_TEMP/cursor-issue-${ISSUE_NUMBER}.json"
          pr_body="$RUNNER_TEMP/cursor-pr-body-${ISSUE_NUMBER}.md"
          issue_title="$(jq -r '.title' "$issue_api" | tr '\r\n' ' ' | cut -c1-180)"
          pr_title="fix: ${issue_title}"
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          printf '%s\n\n' "Cursor Agent が Issue #${ISSUE_NUMBER} を実装しました。" > "$pr_body"
          printf 'Closes #%s\n\n' "$ISSUE_NUMBER" >> "$pr_body"
          printf '%s\n' "検証: \`yarn check\`, \`yarn exec tsc --noEmit\`, \`yarn build\`" >> "$pr_body"
          printf '%s\n' "Workflow: ${run_url}" >> "$pr_body"

          git add --all
          if git diff --cached --quiet; then
            echo "::error::No changes remain to publish"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: resolve issue #${ISSUE_NUMBER}"
          gh auth setup-git
          git push --set-upstream origin "$BRANCH_NAME"

          base_branch="$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')"
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$base_branch" \
            --head "$BRANCH_NAME" \
            --title "$pr_title" \
            --body-file "$pr_body" \
            >/dev/null
          pr_url="$(gh pr view "$BRANCH_NAME" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')"
          gh pr edit "$pr_url" --repo "$GITHUB_REPOSITORY" --add-label agent-created

          success_issue="$RUNNER_TEMP/cursor-success-${ISSUE_NUMBER}.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$success_issue"
          remove_labels="$(jq -r '
            [.labels[].name]
            | map(select(
                . == "agent:in-progress" or
                . == "agent:claimed" or
                . == "agent:blocked" or
                . == "symphony/failed"
              ))
            | join(",")
          ' "$success_issue")"
          if [[ -n "$remove_labels" ]]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$remove_labels"
          fi
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label agent:review
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "✅ 実装 Pull Request を作成しました: ${pr_url}"

      - name: Mark failed implementation
        if: ${{ always() && steps.claim.outcome == 'success' && job.status != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          failure_label="$(
            gh label list \
              --repo "$GITHUB_REPOSITORY" \
              --limit 1000 \
              --json name \
              --jq '.[] | select(.name == "agent:blocked") | .name' \
              | head -n 1
          )"
          if [[ -z "$failure_label" ]]; then
            failure_label="symphony/failed"
          fi

          failed_issue="$RUNNER_TEMP/cursor-failed-${ISSUE_NUMBER}.json"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > "$failed_issue"
          remove_labels="$(jq -r '
            [.labels[].name]
            | map(select(
                . == "agent:in-progress" or
                . == "agent:claimed" or
                . == "agent:review" or
                . == "agent:blocked" or
                . == "symphony/failed"
              ))
            | join(",")
          ' "$failed_issue")"
          if [[ -n "$remove_labels" ]]; then
            gh issue edit "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --remove-label "$remove_labels"
          fi
          gh issue edit "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --add-label "$failure_label"

          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "⚠️ Cursor Agent の実装または検証に失敗しました。詳細: ${run_url}"
