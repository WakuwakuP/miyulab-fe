name: Cursor Daily Work

on:
  schedule:
    - cron: "0 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: cursor-daily-work
  cancel-in-progress: false

jobs:
  select:
    name: Select one eligible issue
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue_number: ${{ steps.select.outputs.issue_number }}

    steps:
      - name: Select by priority and age
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          candidates="$RUNNER_TEMP/cursor-daily-candidates.json"
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label triaged \
            --limit 200 \
            --json number,createdAt,labels \
            > "$candidates"

          owner="$GITHUB_REPOSITORY_OWNER"
          repository_name="${GITHUB_REPOSITORY#*/}"
          query='query($owner: String!, $name: String!, $number: Int!) {
            repository(owner: $owner, name: $name) {
              issue(number: $number) {
                closedByPullRequestsReferences(first: 1) { totalCount }
              }
            }
          }'

          selected=""
          while IFS= read -r candidate; do
            [[ -n "$candidate" ]] || continue
            linked_count="$(
              gh api graphql \
                -f query="$query" \
                -F owner="$owner" \
                -F name="$repository_name" \
                -F number="$candidate" \
                --jq '.data.repository.issue.closedByPullRequestsReferences.totalCount // 0'
            )"
            if [[ "$linked_count" == "0" ]]; then
              selected="$candidate"
              break
            fi
          done < <(
            jq -r '
              def names: [.labels[].name];
              map(select(
                (names | index("agent:in-progress") | not) and
                (names | index("agent:claimed") | not) and
                (names | index("agent:blocked") | not) and
                (names | index("symphony/failed") | not) and
                (names | index("agent:review") | not) and
                (names | index("agent:done") | not) and
                (names | index("agentic-workflows") | not)
              ))
              | map(. + {priority_rank: (
                  names as $labels
                  | if ($labels | index("priority:critical")) then 0
                    elif ($labels | index("priority:high")) then 1
                    elif ($labels | index("priority:medium")) then 2
                    elif ($labels | index("priority:low")) then 3
                    else 4
                    end
                )})
              | sort_by(.priority_rank, .number)
              | .[].number
            ' "$candidates"
          )

          if [[ -n "$selected" ]]; then
            echo "issue_number=$selected" >> "$GITHUB_OUTPUT"
            echo "Selected issue #$selected." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No eligible triaged issue was found." >> "$GITHUB_STEP_SUMMARY"
          fi

  implement:
    name: Implement selected issue
    needs: select
    if: ${{ needs.select.outputs.issue_number != '' }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/cursor-issue-worker.yml
    with:
      issue_number: ${{ needs.select.outputs.issue_number }}
      additional_context: Selected by the scheduled Cursor daily-work workflow.
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
