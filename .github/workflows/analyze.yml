name: Build

on:
  push:
    branches:
      - main


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - run: corepack enable yarn
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn --immutable
      - name: Run tests with coverage
        run: yarn test:coverage
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Show failed Quality Gate conditions
        if: ${{ always() && steps.quality-gate.outcome == 'failure' }}
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: WakuwakuP_miyulab-fe_2b9f1381-5c7d-4b89-8aca-9a9a897900dc
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          response_file="$(mktemp)"
          if ! http_status="$(
            curl --silent \
              --user "${SONAR_TOKEN}:" \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              --get \
              --data-urlencode "projectKey=${SONAR_PROJECT_KEY}" \
              "${SONAR_HOST_URL%/}/api/qualitygates/project_status"
          )"; then
            echo "::warning::Could not request SonarQube Quality Gate details."
            exit 0
          fi

          if [[ "${http_status}" != "200" ]]; then
            echo "::warning::SonarQube Quality Gate API returned HTTP ${http_status}."
            exit 0
          fi

          if ! jq '{
            projectStatus: {
              status: .projectStatus.status,
              conditions: [
                .projectStatus.conditions[]? |
                {
                  status,
                  metricKey,
                  comparator,
                  errorThreshold,
                  actualValue
                }
              ]
            }
          }' "${response_file}"; then
            echo "::warning::SonarQube Quality Gate response was not valid JSON."
          fi
      - name: Queue Cursor SonarQube issue fix
        if: ${{ always() && steps.quality-gate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run cursor-sonarqube-issue-fix.yml --ref main
